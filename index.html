<style>
:root{--bg:#f5f6f7;--card:#fff;--tx:#1d2d3e;--mu:#5b738b;--bd:#d9d9d9;--br:#0070f2;--ac:#e9730c;--sh:#0a1f3d;--ok:#107e3e}
:root[data-t=dark]{--bg:#12181f;--card:#1d252e;--tx:#eaecee;--mu:#9aa9b8;--bd:#33414f;--br:#4aa3ff;--sh:#0b1218}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--sh);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:16px;margin:0;flex:1}header button,header select{background:#ffffff1f;color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit}
header option{color:#000}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;font:inherit;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--br);border-color:var(--br);font-weight:700}
main{max-width:1200px;margin:auto;padding:12px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
.chip b{color:var(--br);direction:ltr;unicode-bidi:isolate}.chip.on{background:var(--br);color:#fff}.chip.on b{color:#fff}
.split{display:grid;gap:12px}@media(min-width:900px){.split{grid-template-columns:1fr 1.25fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
ol.steps{list-style:none;padding:0;margin:0}
ol.steps li{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;align-items:flex-start}
ol.steps li.on{background:#e9730c22}
ol.steps i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--br);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
ol.steps li.on i{background:var(--ac)}
.scr{width:100%;height:auto;direction:ltr;background:#fff;border-radius:8px;border:1px solid var(--bd)}
.scr .st{cursor:pointer}.scr .st circle{fill:var(--br)}.scr .st line{stroke:var(--br);stroke-width:2;marker-end:url(#a1)}
.scr .st.on circle{fill:var(--ac)}.scr .st.on line{stroke:var(--ac);stroke-width:3;marker-end:url(#a2)}
.scr .st rect.f{fill:#fff;stroke:#89a;stroke-width:1}.scr .st.on rect.f{stroke:var(--ac);stroke-width:3;fill:#fff4e8}
.scr text{font:12px Arial,sans-serif}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:top}
.mv{direction:ltr;font-weight:700;color:var(--br)}
.er{border-inline-start:4px solid #bb0000;padding:4px 10px;margin:6px 0;background:#bb000010;border-radius:4px}
.er b{direction:ltr;unicode-bidi:isolate}
.btn{background:var(--br);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.flow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.stg{flex:none;width:150px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px;font:inherit;text-align:start;cursor:pointer}
.stg.on{border-color:var(--ac)}.stg i{font-style:normal;background:var(--br);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;margin-bottom:4px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;color:#fff;margin:2px}
.cv{position:relative;border:1px dashed var(--bd);border-radius:8px;overflow:hidden;direction:ltr}.cv img{width:100%;display:block}.cv svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mi{display:flex;gap:6px;margin:4px 0;align-items:center}.mi i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-style:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.tc{display:flex;flex-direction:column;gap:2px;text-align:start;background:var(--card);border:1px solid var(--bd);border-inline-start:5px solid var(--mc);border-radius:10px;padding:8px 10px;color:var(--tx);font:inherit;cursor:pointer;min-height:76px}
.tc b{direction:ltr;unicode-bidi:isolate;font-size:17px;color:var(--mc);text-align:start}.tc span{font-size:13px;line-height:1.35}.tc small{color:var(--mu);font-size:11px;margin-top:auto}
.tc.on{background:var(--mc);border-color:var(--mc)}.tc.on b,.tc.on span,.tc.on small{color:#fff}
.ex{grid-column:1/-1;border:2px solid var(--mc);border-radius:12px;padding:10px;background:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible,li:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
footer{max-width:1200px;margin:8px auto 24px;padding:0 12px;color:var(--mu);font-size:12px}
.cp{margin-inline-start:8px;font-size:12px;padding:2px 8px}.dsc{margin:8px 0 0;color:var(--mu)}

let S={img:null,w:1000,h:600,markers:[],arrows:[],mode:"num",p:null};
function stu(){$("#app").innerHTML=`<div class="card"><p>${u("hint")}</p><div class="row"><input id="fc" style="flex:1;min-width:90px" placeholder="${u("code")}"><input id="fn" style="flex:2;min-width:140px" placeholder="${u("nm")}"></div>
<div class="row"><input type="file" accept="image/*" id="fi" style="flex:1"><button class="btn ${S.mode=="num"?"":"s"}" onclick="S.mode='num';S.p=null;stu()">${u("num")}</button><button class="btn ${S.mode=="arr"?"":"s"}" onclick="S.mode='arr';stu()">${u("arr")}</button><button class="btn s" onclick="S.markers=[];S.arrows=[];stu()">${u("clr")}</button></div>

$("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{S={...S,img:r.result,w:i.width,h:i.height,markers:[],arrows:[]};stu()};i.src=r.result};r.readAsDataURL(f)};

function draw(){const sv=$("#sv");if(!sv)return;const r=S.w/45;sv.innerHTML=`<defs><marker id="m" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#e9730c"/></marker></defs>`+S.arrows.map(a=>`<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="#e9730c" stroke-width="${r/4}" marker-end="url(#m)"/>`).join("")+S.markers.map(m=>`<circle cx="${m.x}" cy="${m.y}" r="${r}" fill="#e9730c"/><text x="${m.x}" y="${m.y+r/3}" fill="#fff" text-anchor="middle" style="font:700 ${r*1.1}px Arial">${m.n}</text>`).join("");
